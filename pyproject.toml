[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-t1dm"
version = "0.1.0"
description = "Bayesian forecasting and recommendation pipeline for personal T1DM data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "openpyxl>=3.1",
  "matplotlib>=3.8",
  "pyarrow>=15",
  "arviz>=0.16,<1",
  "pymc>=5.0,<6",
  # Tandem Source retired the endpoints used by 2.x in mid-2026; 3.0.3 follows the current API.
  "tconnectsync>=3.0.3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
bayesian-t1dm = "bayesian_t1dm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
# Correctness only: syntax errors, undefined names, unused imports and variables.
select = ["E9", "F"]
